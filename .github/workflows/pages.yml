name: Deploy client to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - name: Set the default backend
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e '
            const fs = require("node:fs");
            const base = (process.env.API_BASE || "").trim().replace(/\/+$/, "");
            fs.writeFileSync("public/config.js",
              `// Generated by the Pages workflow.\nexport const API_BASE = ${JSON.stringify(base)};\n`);
          '

      - run: node scripts/stamp-frontend-version.mjs public "$GITHUB_SHA"
      - run: touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
