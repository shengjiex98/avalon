# Publishes the front end (public/) to GitHub Pages.
#
# Pages is static hosting, so it serves the page but not the game. Set the
# repository variable API_BASE to the HTTPS address of a running server
# (Settings → Secrets and variables → Actions → Variables). Leave it unset and
# the page still deploys — it just asks each player for a server address.
name: Deploy front end to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Point the client at the backend
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e '
            const fs = require("node:fs");
            const base = (process.env.API_BASE || "").trim().replace(/\/+$/, "");
            fs.writeFileSync("public/config.js",
              `// Generated by .github/workflows/pages.yml — do not edit.\nexport const API_BASE = ${JSON.stringify(base)};\n`);
            console.log(base ? `API base: ${base}` : "No API_BASE set; players will be asked for a server address.");
          '
          cat public/config.js

      - name: Bypass Jekyll
        run: touch public/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
