name: Deploy

# Publish one immutable server release, wake the host, prove that exact commit
# through the public application, and only then publish its Pages client.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package the immutable release
        run: scripts/package-release.sh "$GITHUB_SHA" dist
      - name: Test the exact packaged release
        run: |
          set -eu
          archive="dist/avalon-$GITHUB_SHA.tar.gz"
          tree="$RUNNER_TEMP/release-tree"
          mkdir "$tree"
          tar -xzf "$archive" --strip-components=1 -C "$tree"

          # This verifier comes from the trusted checked-out workflow revision,
          # never from inside the candidate tree.
          node scripts/verify-packaged-release.mjs "$tree" "$GITHUB_SHA"
          (
            cd "$tree"
            node --test "test/**/*.test.js"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: avalon-${{ github.sha }}
          path: dist/avalon-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-artifact:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avalon-${{ github.sha }}
          path: dist
      - id: publish
        name: Publish the exact tested release and stable pointer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          echo 'published=false' >>"$GITHUB_OUTPUT"
          release_tag=deployment-artifacts
          archive="avalon-$GITHUB_SHA.tar.gz"

          # A superseded run must never move the mutable pointer backward.
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::superseded by $main_sha; not publishing $GITHUB_SHA"
            exit 0
          fi

          digest=$(sha256sum "dist/$archive" | sed 's/[[:space:]].*//')
          node -e '
            const fs = require("node:fs");
            const [commit, sha256, output] = process.argv.slice(1);
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("invalid commit");
            if (!/^[0-9a-f]{64}$/.test(sha256)) throw new Error("invalid sha256");
            fs.writeFileSync(output, `${JSON.stringify({ schema: 1, commit, sha256 }, null, 2)}\n`);
          ' "$GITHUB_SHA" "$digest" dist/latest.json

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --target "$GITHUB_SHA" \
              --title "Avalon deployment artifacts" \
              --notes "Immutable artifacts consumed by the Avalon static updater." \
              --latest=false
          fi

          # The immutable payload must exist before latest.json can select it.
          gh release upload "$release_tag" "dist/$archive" --clobber
          gh release upload "$release_tag" dist/latest.json --clobber
          echo 'published=true' >>"$GITHUB_OUTPUT"

      - name: Prune superseded release assets
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          release_tag=deployment-artifacts

          # The host downloads only latest.json and the single archive that
          # pointer names, and rolls back to a release already on disk, so no
          # older asset is ever fetched. The few kept exist purely so an
          # operator can repoint latest.json by hand. Housekeeping must never
          # fail a deploy that already published: every failure is a warning.
          skip() { echo "::warning::$1; skipped pruning"; exit 0; }

          release_id=$(gh api "repos/$GH_REPO/releases/tags/$release_tag" --jq '.id') \
            || skip 'cannot resolve the release'
          gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --paginate --slurp >"$RUNNER_TEMP/assets.json" \
            || skip 'cannot list release assets'

          # Keep latest.json, the five newest archives, and this commit's own.
          # This release carries nothing else by design, so anything unmatched
          # is debris from a retired pipeline and goes.
          node -e '
            const fs = require("node:fs");
            const [file, commit] = process.argv.slice(1);
            const assets = JSON.parse(fs.readFileSync(file, "utf8")).flat();
            const archive = /^avalon-[0-9a-f]{40}\.tar\.gz$/;
            const keep = new Set(["latest.json", `avalon-${commit}.tar.gz`]);
            assets
              .filter((asset) => archive.test(asset.name))
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
              .slice(0, 5)
              .forEach((asset) => keep.add(asset.name));
            for (const asset of assets) {
              if (!keep.has(asset.name)) console.log(`${asset.id} ${asset.name}`);
            }
          ' "$RUNNER_TEMP/assets.json" "$GITHUB_SHA" >"$RUNNER_TEMP/doomed" \
            || skip 'cannot select assets to prune'

          while read -r id name; do
            if gh api -X DELETE "repos/$GH_REPO/releases/assets/$id" >/dev/null; then
              echo "::notice::pruned $name"
            else
              echo "::warning::could not prune $name"
            fi
          done <"$RUNNER_TEMP/doomed"

  deploy-server:
    needs: publish-artifact
    if: needs.publish-artifact.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wake the server, then wait for it to serve this commit
        env:
          NTFY_SERVER: https://ntfy.sh
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -eu
          : "${NTFY_TOPIC:?set the NTFY_TOPIC repository secret}"
          : "${API_BASE:?set the API_BASE repository variable}"

          publish() {
            curl -fsS --max-time 10 -d deploy "$NTFY_SERVER/$NTFY_TOPIC" >/dev/null
          }

          publish
          echo "::notice::asked the server to reconcile with $GITHUB_SHA"

          for i in $(seq 1 360); do
            sleep 10
            commit=$(curl -fsS --max-time 10 "$API_BASE/api/health" | jq -r '.commit // empty') || commit=
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "the server is serving $GITHUB_SHA"
              exit 0
            fi

            # Re-wake every five minutes. A deferred incompatible update then
            # lands as soon as the active table becomes safe.
            if [ $((i % 30)) -eq 0 ]; then publish; fi
          done

          echo "::error::the server never reported $GITHUB_SHA; Pages was not published"
          exit 1

  deploy-pages:
    needs: deploy-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set the default backend
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e '
            const fs = require("node:fs");
            const base = (process.env.API_BASE || "").trim().replace(/\/+$/, "");
            fs.writeFileSync("public/config.js",
              `// Generated by the deploy workflow.\nexport const API_BASE = ${JSON.stringify(base)};\n`);
          '

      - run: node scripts/stamp-frontend-version.mjs public "$GITHUB_SHA"
      - run: touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
