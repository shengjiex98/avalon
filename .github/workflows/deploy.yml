name: Deploy

# One pipeline so the two halves of a release stay ordered: the game server
# takes the commit first, then the Pages client that talks to it. A client
# newer than its server is the case players notice, because the protocol check
# closes the lobby.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true   # a run still waiting for an idle server is superseded

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the runtime the release manifest requires on the server host.
          node-version: '24'
      - name: Package the immutable release
        run: scripts/package-release.sh "$GITHUB_SHA" dist
      - name: Test the exact release bytes
        run: |
          set -eu
          archive="avalon-$GITHUB_SHA.tar.gz"
          (cd dist && sha256sum -c "$archive.sha256")
          mkdir tested-release
          tar -xzf "dist/$archive" --strip-components=1 -C tested-release
          (cd tested-release && npm test)
      - uses: actions/upload-artifact@v4
        with:
          name: avalon-${{ github.sha }}
          path: |
            dist/avalon-${{ github.sha }}.tar.gz
            dist/avalon-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish-artifact:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avalon-${{ github.sha }}
          path: dist
      - name: Publish the exact tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          release_tag=deployment-artifacts
          archive="avalon-$GITHUB_SHA.tar.gz"
          (cd dist && sha256sum -c "$archive.sha256")
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --target "$GITHUB_SHA" \
              --title "Avalon deployment artifacts" \
              --notes "Immutable artifacts consumed by the Avalon release controller." \
              --latest=false
          fi
          gh release upload "$release_tag" \
            "dist/$archive" "dist/$archive.sha256" --clobber

  deploy-server:
    needs: publish-artifact
    runs-on: ubuntu-latest
    steps:
      # The topic is a channel, not an authority. A stranger who learns it can
      # make the Pi run `git fetch` and find nothing, or claim a deployment that
      # did not happen -- which is why success below is decided by the server's
      # own /api/health, never by a message.
      - name: Ask the server to deploy, then wait for it to serve this commit
        env:
          NTFY_SERVER: https://ntfy.sh
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -eu
          : "${NTFY_TOPIC:?set the NTFY_TOPIC repository secret}"
          : "${API_BASE:?set the API_BASE repository variable}"

          publish() {
            curl -fsS --max-time 10 -d "deploy $GITHUB_SHA" "$NTFY_SERVER/$NTFY_TOPIC" >/dev/null
          }

          # Captured before publishing: if the Pi finishes before the first poll,
          # `since` replays the result rather than leaving us waiting on a
          # message that has already been and gone.
          since=$(date +%s)
          publish
          echo "::notice::asked the server to deploy $GITHUB_SHA"

          for i in $(seq 1 360); do          # 360 x 10s = one hour
            sleep 10

            commit=$(curl -fsS --max-time 10 "$API_BASE/api/health" | jq -r '.commit // empty') || commit=
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "the server is serving $GITHUB_SHA"
              exit 0
            fi

            # Status messages are for diagnosis and for failing fast; ntfy.sh
            # rate-limits per visitor, so ask a third as often as health.
            if [ $((i % 3)) -eq 0 ]; then
              status=$(curl -fsS --max-time 10 "$NTFY_SERVER/$NTFY_TOPIC/json?poll=1&since=$since" \
                | jq -r --arg sha "$GITHUB_SHA" \
                  'select(.event == "message") | .message | select(contains($sha))') || status=
              case "$status" in
                *"failed $GITHUB_SHA"*)
                  echo "::error::the server rejected this commit and rolled back: $status"
                  exit 1 ;;
                *"busy $GITHUB_SHA"*)
                  echo "::notice::a game is in progress; waiting for the table to clear" ;;
              esac
            fi

            # Re-ask every five minutes, so a deploy refused mid-game lands as
            # soon as the game ends rather than waiting for the hourly timer.
            if [ $((i % 30)) -eq 0 ]; then publish; fi
          done

          echo "::error::the server never reported $GITHUB_SHA; nothing was published"
          exit 1

  deploy-pages:
    needs: deploy-server   # skipped when the server did not take the commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set the default backend
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e '
            const fs = require("node:fs");
            const base = (process.env.API_BASE || "").trim().replace(/\/+$/, "");
            fs.writeFileSync("public/config.js",
              `// Generated by the deploy workflow.\nexport const API_BASE = ${JSON.stringify(base)};\n`);
          '

      - run: node scripts/stamp-frontend-version.mjs public "$GITHUB_SHA"
      - run: touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
