name: Deploy

# Publish one immutable server release, wake the host, prove that exact commit
# through the public application, and only then publish its Pages client.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:browser
      - run: npm run test:built
      - run: npm run typecheck
      - name: Stage the self-hosted and Pages clients from the tested build
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: node scripts/stage-browser-artifacts.mjs "$GITHUB_SHA" dist "$API_BASE"
      - name: Package the immutable release
        run: scripts/package-release.sh "$GITHUB_SHA" dist dist/self-hosted-public node_modules
      - name: Test the exact server and Pages artifacts
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -eu
          archive="dist/avalon-$GITHUB_SHA.tar.gz"
          tree="$RUNNER_TEMP/release-tree"
          mkdir "$tree"
          tar -xzf "$archive" --strip-components=1 -C "$tree"

          # This verifier comes from the trusted checked-out workflow revision,
          # never from inside the candidate tree.
          node scripts/verify-packaged-release.mjs "$tree" "$GITHUB_SHA"
          node scripts/test-packaged-release.mjs "$tree" "$GITHUB_SHA"
          node scripts/verify-browser-artifact.mjs dist/pages pages "$GITHUB_SHA" "$API_BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: avalon-${{ github.sha }}
          path: dist/avalon-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: avalon-pages-${{ github.sha }}
          path: dist/pages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish-artifact:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avalon-${{ github.sha }}
          path: dist
      - id: publish
        name: Publish the exact tested release and stable pointer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          echo 'published=false' >>"$GITHUB_OUTPUT"
          release_tag=deployment-artifacts
          archive="avalon-$GITHUB_SHA.tar.gz"

          # A superseded run must never move the mutable pointer backward.
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::superseded by $main_sha; not publishing $GITHUB_SHA"
            exit 0
          fi

          digest=$(sha256sum "dist/$archive" | sed 's/[[:space:]].*//')
          node -e '
            const fs = require("node:fs");
            const [commit, sha256, output] = process.argv.slice(1);
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("invalid commit");
            if (!/^[0-9a-f]{64}$/.test(sha256)) throw new Error("invalid sha256");
            fs.writeFileSync(output, `${JSON.stringify({ schema: 1, commit, sha256 }, null, 2)}\n`);
          ' "$GITHUB_SHA" "$digest" dist/latest.json

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --target "$GITHUB_SHA" \
              --title "Avalon deployment artifacts" \
              --notes "Immutable artifacts consumed by the Avalon static updater." \
              --latest=false
          fi

          # The immutable payload must exist before latest.json can select it.
          gh release upload "$release_tag" "dist/$archive" --clobber
          gh release upload "$release_tag" dist/latest.json --clobber
          echo 'published=true' >>"$GITHUB_OUTPUT"

      - name: Prune unreachable release assets
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          release_tag=deployment-artifacts
          skip() { echo "::warning::$1; skipped pruning"; exit 0; }

          # Only the archive latest.json names is reachable. Read the pointer
          # back, so a superseding run's archive is never the one deleted.
          keep=$(gh release download "$release_tag" -p latest.json -O - \
            | jq -r '"avalon-\(.commit).tar.gz"') || skip 'cannot read latest.json'
          assets=$(gh api "repos/$GH_REPO/releases/tags/$release_tag") \
            || skip 'cannot list release assets'

          # Never strip the release down to a pointer nothing can satisfy.
          printf '%s' "$assets" | jq -e --arg keep "$keep" 'any(.assets[]; .name == $keep)' \
            >/dev/null || skip "the pointer names a missing $keep"

          printf '%s' "$assets" | jq -r --arg keep "$keep" \
            '.assets[] | select(.name != "latest.json" and .name != $keep) | "\(.id) \(.name)"' \
            >"$RUNNER_TEMP/doomed"
          while read -r id name; do
            # Housekeeping never fails a rollout that already published.
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$id" >/dev/null \
              && echo "::notice::pruned $name" || echo "::warning::could not prune $name"
          done <"$RUNNER_TEMP/doomed"

  deploy-server:
    needs: publish-artifact
    if: needs.publish-artifact.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wake the server, then wait for it to serve this commit
        env:
          NTFY_SERVER: https://ntfy.sh
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -eu
          : "${NTFY_TOPIC:?set the NTFY_TOPIC repository secret}"
          : "${API_BASE:?set the API_BASE repository variable}"

          publish() {
            curl -fsS --max-time 10 -d deploy "$NTFY_SERVER/$NTFY_TOPIC" >/dev/null
          }

          publish
          echo "::notice::asked the server to reconcile with $GITHUB_SHA"

          for i in $(seq 1 360); do
            sleep 10
            commit=$(curl -fsS --max-time 10 "$API_BASE/api/health" | jq -r '.commit // empty') || commit=
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "the server is serving $GITHUB_SHA"
              exit 0
            fi

            # Re-wake every five minutes. A deferred incompatible update then
            # lands as soon as the active table becomes safe.
            if [ $((i % 30)) -eq 0 ]; then publish; fi
          done

          echo "::error::the server never reported $GITHUB_SHA; Pages was not published"
          exit 1

  deploy-pages:
    needs: deploy-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avalon-pages-${{ github.sha }}
          path: dist/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
